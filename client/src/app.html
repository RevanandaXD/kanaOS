<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				try {
					var theme = localStorage.getItem('kanaos-theme');
					theme = theme === 'light' || theme === 'dark' ? theme : 'dark';
					document.documentElement.dataset.theme = theme;
					document.documentElement.classList.toggle('dark', theme === 'dark');
					document.documentElement.classList.toggle('light', theme === 'light');
					document.documentElement.style.colorScheme = theme;

					var allowed = [
						'/wallpaper-default1.jpg',
						'/wallpaper-default2.jpg',
						'/wallpaper-default3.jpg',
						'/wallpaper-default4.jpg'
					];
					var wp = localStorage.getItem('kanaos-wallpaper');
					if (allowed.indexOf(wp) === -1) wp = '/wallpaper-default1.jpg';
					document.documentElement.style.setProperty('--kanaos-wallpaper', "url('" + wp + "')");
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
