name: Repository stats

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/stats.svg'
      - 'README.md'
  schedule:
    # Tiap hari pukul 03.23 UTC
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # Hindari loop ketika commit dari workflow ini sendiri memicu push event.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate public/stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/generate-stats.sh

      - name: Commit statistik jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats.svg
          if git diff --cached --quiet; then
            echo "Statistik tidak berubah, tidak ada commit baru."
            exit 0
          fi
          git commit -m "chore(stats): update repository stats [skip ci]"
          git push
