services:
  kanaos:
    image: ghcr.io/revanandaxd/kanaos:${TAG:-latest}
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - CONFIG_PATH=/app/config/service.yml
      - DOCKER_CACHE_TTL=3s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/app/config:ro
    mem_limit: 512m
    restart: unless-stopped
