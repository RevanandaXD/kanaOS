name: kanaos

services:
  api:
    image: ghcr.io/revanandaxd/kanaos-api:${TAG:-latest}
    environment:
      - PORT=8080
      - CONFIG_PATH=/app/config/service.yml
      - DOCKER_CACHE_TTL=3s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/app/config:ro
    group_add:
      - "${DOCKER_GID:-999}"
    mem_limit: 128m
    restart: unless-stopped

  web:
    image: ghcr.io/revanandaxd/kanaos-web:${TAG:-latest}
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    mem_limit: 256m
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped